name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Apple Books DB paths and the osascript adapter only exist on macOS.
    # Tests use in-memory SQLite + no-op fakes, but typecheck still pulls in
    # the bun:sqlite types, so macos-latest is the safest baseline.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
